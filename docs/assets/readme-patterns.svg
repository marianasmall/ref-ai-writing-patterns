<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">AI Writing Patterns: 24 patterns in 5 categories</title>
  <desc id="d">Pattern categories with counts from humanizer-skill/patterns.md, plus a before and after email example from examples/before-after.md.</desc>
  <style>
    .h{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .s{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
    .k{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .n{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .e{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .lb{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
  </style>
  <rect x="0.5" y="0.5" width="879" height="559" rx="14" fill="#ffffff" stroke="#d1d9e0"/>

  <text x="32" y="48" class="h">24 patterns the humanizer skill checks</text>
  <text x="32" y="72" class="s">Grouped as in humanizer-skill/patterns.md. Each bar is one pattern.</text>

  <!-- Category rows: label, bar of N units (each 18px wide, 4px gap), count -->
  <g transform="translate(32,100)">
    <text x="0" y="16" class="k">Content &amp; Structure</text>
    <g fill="#d97757"><rect x="230" y="2" width="18" height="18" rx="3"/><rect x="252" y="2" width="18" height="18" rx="3"/><rect x="274" y="2" width="18" height="18" rx="3"/><rect x="296" y="2" width="18" height="18" rx="3"/></g>
    <text x="330" y="16" class="n">4</text>
  </g>
  <g transform="translate(32,134)">
    <text x="0" y="16" class="k">Language Choices</text>
    <g fill="#d97757"><rect x="230" y="2" width="18" height="18" rx="3"/><rect x="252" y="2" width="18" height="18" rx="3"/><rect x="274" y="2" width="18" height="18" rx="3"/><rect x="296" y="2" width="18" height="18" rx="3"/><rect x="318" y="2" width="18" height="18" rx="3"/><rect x="340" y="2" width="18" height="18" rx="3"/></g>
    <text x="374" y="16" class="n">6</text>
  </g>
  <g transform="translate(32,168)">
    <text x="0" y="16" class="k">Style Markers</text>
    <g fill="#d97757"><rect x="230" y="2" width="18" height="18" rx="3"/><rect x="252" y="2" width="18" height="18" rx="3"/><rect x="274" y="2" width="18" height="18" rx="3"/><rect x="296" y="2" width="18" height="18" rx="3"/><rect x="318" y="2" width="18" height="18" rx="3"/><rect x="340" y="2" width="18" height="18" rx="3"/><rect x="362" y="2" width="18" height="18" rx="3"/></g>
    <text x="396" y="16" class="n">7</text>
  </g>
  <g transform="translate(32,202)">
    <text x="0" y="16" class="k">Communication Patterns</text>
    <g fill="#d97757"><rect x="230" y="2" width="18" height="18" rx="3"/><rect x="252" y="2" width="18" height="18" rx="3"/><rect x="274" y="2" width="18" height="18" rx="3"/><rect x="296" y="2" width="18" height="18" rx="3"/><rect x="318" y="2" width="18" height="18" rx="3"/><rect x="340" y="2" width="18" height="18" rx="3"/></g>
    <text x="374" y="16" class="n">6</text>
  </g>
  <g transform="translate(32,236)">
    <text x="0" y="16" class="k">Filler &amp; Hedging</text>
    <g fill="#d97757"><rect x="230" y="2" width="18" height="18" rx="3"/></g>
    <text x="264" y="16" class="n">1</text>
  </g>

  <!-- Example pair -->
  <text x="32" y="302" class="s">Example 1 from examples/before-after.md: filler phrases (#21) and excessive hedging (#20)</text>

  <rect x="32" y="316" width="400" height="212" rx="10" fill="#fff4f0" stroke="#f2c4b3"/>
  <text x="52" y="342" class="lb" fill="#b5492a">BEFORE</text>
  <text class="e">
    <tspan x="52" y="368">I hope this email finds you well. It's important</tspan>
    <tspan x="52" y="388">to note that I wanted to reach out regarding the</tspan>
    <tspan x="52" y="408">possibility of perhaps scheduling a brief meeting</tspan>
    <tspan x="52" y="428">to discuss what might be some potential</tspan>
    <tspan x="52" y="448">opportunities for collaboration between our</tspan>
    <tspan x="52" y="468">teams. It should be emphasized that I think there</tspan>
    <tspan x="52" y="488">could potentially be some interesting synergies</tspan>
    <tspan x="52" y="508">worth exploring.</tspan>
  </text>

  <rect x="448" y="316" width="400" height="212" rx="10" fill="#eef7f0" stroke="#b7dcc2"/>
  <text x="468" y="342" class="lb" fill="#1a7f37">AFTER</text>
  <text class="e">
    <tspan x="468" y="368">I'd like to schedule a meeting to discuss</tspan>
    <tspan x="468" y="388">collaboration opportunities between our teams.</tspan>
    <tspan x="468" y="408">Are you available next week for a 30-minute</tspan>
    <tspan x="468" y="428">conversation?</tspan>
  </text>
</svg>
